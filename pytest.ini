[pytest]
# Pytest configuration for HTML Translation Tool

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Test paths
testpaths = app/tests

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests
